[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whichmcp"
version = "0.1.0"
description = "List which MCP config files each coding agent will actually load from this repo."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shurong Cao", email = "170531907+CAOShurong@users.noreply.github.com" }]
keywords = ["ai-agents", "mcp", "claude-code", "cursor", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CAOShurong/whichmcp"
Repository = "https://github.com/CAOShurong/whichmcp"

[project.scripts]
whichmcp = "whichmcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --basetemp=.pytest_tmp"
